<!DOCTYPE html>

<head>

</head>

    <div>

                <input type="text" name="nome" id="nome">
                <input type="text" name="nome" id="nome">
                <input type="text" name="nome" id="nome">

            </div>

            <div>

                    <svg id="in" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"

                        </g>
                    </svg>
                    <svg id="in3" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 48 48" fill="none"

                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"

    <script src="../jquery.drawsvg.min.js"></script>
    <script>
        var cafeSVG = $('#in').drawsvg({ duration: 1200 });
        var imaginSVG = $('#in2').drawsvg({ duration: 2500 });
        var caosSVG = $('#in3').drawsvg({ duration: 2500 });
        var amorSVG = $('#in4').drawsvg({ duration: 1200 });

        cafeSVG.drawsvg('animate');
        imaginSVG.drawsvg('animate');
        caosSVG.drawsvg('animate');
        amorSVG.drawsvg('animate');
    </script>
