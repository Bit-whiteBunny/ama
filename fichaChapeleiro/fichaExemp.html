<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem</title>
    <link rel="stylesheet" href="aparenceFichaExemp.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <button id="voltar">
        <a href="../inicio/paginaInicial.html">
            <img class="logo" src="../imagens/logo.jpeg" alt="Brasão da Arcane Mirror Academy" height="100px">
            <span class="ivoltar">&#8592;</span>
        </a>
    </button>
    <!-- Formulário principal da ficha -->
    <form class="dados-ficha">
        <!-- Campo para inserir o nome do personagem -->
        <div class="campo-linha">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
        </div>

        <!-- Campo para inserir a idade do personagem -->
        <div class="campo-linha">
            <label for="idade">Idade:</label>
            <input type="text" id="idade" name="idade">
        </div>

        <!-- Campo para inserir o ano escolar ou período -->
        <div class="campo-linha">
            <label for="ano">Ano:</label>
            <input type="text" id="ano" name="ano" placeholder="(1º, 2º, 3º...)">
        </div>

        <!-- Área de texto para descrição física e personalidade -->
        <div class="campo-texto">
            <label for="descricao">Descrição Física/Personalidade:</label>
            <textarea id="descricao" name="descricao" rows="3"></textarea>
        </div>

        <!-- Seção de atributos do personagem -->
        <div class="secao-atributos">
            <h3>Atributos:</h3>

            <!-- Grupo contendo os ícones SVG e campos de atributos -->
            <div class="grupo-animacao">
                <!-- Primeiro atributo com ícone SVG -->
                <div class="linha-icone">
                    <svg id="in" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                        stroke-linejoin="round">
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2">
                            <path
                                d="M3 14c.83.642 2.077 1.017 3.5 1c1.423.017 2.67-.358 3.5-1s2.077-1.017 3.5-1c1.423-.017 2.67.358 3.5 1M8 3a2.4 2.4 0 0 0-1 2a2.4 2.4 0 0 0 1 2m4-4a2.4 2.4 0 0 0-1 2a2.4 2.4 0 0 0 1 2" />
                            <path d="M3 10h14v5a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6z" />
                            <path d="M16.746 16.726a3 3 0 1 0 .252-5.555" />
                        </g>
                    </svg>
                    <input type="text" name="attr_cafe">
                </div>
                <!-- Segundo atributo com ícone SVG -->
                <div class="linha-icone">
                    <svg id="in2" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 48 48"
                        fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                        stroke-linejoin="round">
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="4">
                            <path
                                d="M40 30V15L27.5 7.969m-7 0L8 15v15m3 4.688L24 42l8-4.5l5-2.812M21 18.75l-3 1.75v7l3 1.75L24 31l3-1.75l3-1.75v-7l-3-1.75L24 17zM24 17v-7m6 17l7 4m-19-4l-7 4" />
                            <circle cx="24" cy="7" r="3" />
                            <circle cx="8" cy="33" r="3" />
                            <circle cx="40" cy="33" r="3" />
                        </g>
                    </svg>
                    <input type="text" name="attr_espiral">
                </div>
                <!-- Terceiro atributo com ícone SVG -->
                <div class="linha-icone">
                    <svg id="in3" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 48 48"
                        fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                        stroke-linejoin="round">
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="4">
                            <path
                                d="M8 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8m2 30a6 6 0 1 0 0-12a6 6 0 0 0 0 12m28 2a6 6 0 1 0 0-12a6 6 0 0 0 0 12M22 28a8 8 0 1 0 0-16a8 8 0 0 0 0 16m12-16a4 4 0 1 0 0-8a4 4 0 0 0 0 8"
                                clip-rule="evenodd" />
                            <path d="m11 11l4 4m15-3l-2 2m6 19.5L28 26m-14 5l4-4" />
                        </g>
                    </svg>
                    <input type="text" name="attr_espelho">
                </div>
                <!-- Quarto atributo com ícone SVG -->
                <div class="linha-icone">
                    <svg id="in4" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512"
                        fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="32"
                            d="M352.92 80C288 80 256 144 256 144s-32-64-96.92-64c-52.76 0-94.54 44.14-95.08 96.81c-1.1 109.33 86.73 187.08 183 252.42a16 16 0 0 0 18 0c96.26-65.34 184.09-143.09 183-252.42c-.54-52.67-42.32-96.81-95.08-96.81" />
                    </svg>
                    <input type="text" name="attr_coracao">
                </div>
            </div>

            <!-- Coluna contendo checkboxes de perícias ou características -->
            <div class="coluna-checkbox">
                <label class="item-checkbox"><input type="checkbox" name="festa_improvisada"> Festa Improvisada</label>
                <label class="item-checkbox"><input type="checkbox" name="invencao_maluca"> Invenção Maluca</label>
                <label class="item-checkbox"><input type="checkbox" name="pocao_aleatoria"> Poção Aleatória</label>
                <label class="item-checkbox"><input type="checkbox" name="riso_contagiante"> Riso Contagiante</label>
                <label class="item-checkbox"><input type="checkbox" name="distorcao_do_espaco"> Distorção do
                    Espaço</label>
                <label class="item-checkbox"><input type="checkbox" name="xicara_infinita"> Xícara Infinita</label>
                <label class="item-checkbox"><input type="checkbox" name="troca_de_chapeus"> Troca de chapéus</label>
                <label class="item-checkbox"><input type="checkbox" name="teoria_impossivel"> Teoria impossível</label>
                <label class="item-checkbox"><input type="checkbox" name="balde_de_surpresas"> Balde de
                    Surpresas</label>
                <label class="item-checkbox"><input type="checkbox" name="caos_controlado"> Caos Controlado</label>
            </div>
        </div>

        <!-- Seção de status de combate/vida e magias -->
        <div class="secao-status">
            <!-- Grupo de campos para Pontos de Vida (PV) e Pontos de Energia (PE) -->
            <div class="grupo-pv-pe">
                <div class="item-pv-pe">
                    <label for="pv">PV =</label>
                    <input type="text" id="pv" name="pv">
                </div>
                <div class="item-pv-pe">
                    <label for="pe">PE =</label>
                    <input type="text" id="pe" name="pe">
                </div>
            </div>

            <!-- Coluna com checkboxes de status adicionais -->
            <div class="coluna-checkbox">
                <label class="item-checkbox"><input type="checkbox" name="relogios_e_cronomagia"> Relógios &
                    Cronomagia</label>
                <label class="item-checkbox"><input type="checkbox" name="artes_lunaticas"> Artes Lunáticas</label>
                <label class="item-checkbox"><input type="checkbox" name="alquimia_do_cha"> Alquimia do Chá</label>
            </div>
        </div>

        <!-- Campo de texto para listar equipamentos e itens mágicos -->
        <div class="campo-texto">
            <label for="equipamentos">Equipamentos e Itens Mágicos:</label>
            <textarea id="equipamentos" name="equipamentos" rows="2"></textarea>
        </div>

        <!-- Campo de texto para descrever armas ou ferramentas mágicas -->
        <div class="campo-texto2">
            <label for="arma">Arma / Ferramenta Mágica:</label>
            <textarea id="arma" name="arma" rows="3"></textarea>
        </div>

        <!-- Imagem decorativa da silhueta do coelho no canto inferior -->
        <svg class="icone-chapeleiro" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 64 64"
            style="width: 50px; height: 50px; color: #46563c;">
            <path d="M0 0h64v64H0z" fill="none" />
            <path fill="currentColor"
                d="M61.338 41.881c-1.663-3.873-5.663-4.015-11.069-3.241c.041-9.028 1.562-17.65 4.452-27.072c1.344-3.374-8.67-9.501-22.72-9.567c-14.05.066-24.065 6.192-22.721 9.566c2.873 9.365 4.384 18.047 4.438 27.07c-5.399-.771-9.394-.627-11.057 3.243C-.961 49.077 10.487 62 32 62c21.514 0 32.961-12.923 29.338-20.119m-48.856 5.962s1.357-4.745 1.14-7.254c11.804 10.624 24.954 10.624 36.757 0c.045 2.56 1.139 7.254 1.139 7.254c-11.62 11.057-27.415 11.057-39.036 0" />
        </svg>
    </form>


    <button id="rolar" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop"> <span>Rolar dado</span></button>

    <div class="modal" id="staticBackdrop" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Vamos rolar os Dados!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="perg"><label for="num_dados">Número de dados d6</label> <input type="number" name=""
                            id="num" min="1" onkeydown="if(event.key==='-') event.preventDefault();"> <button
                            class="rolar" onclick="rolar()">Rolar!</button></div>
                    <div id="result">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="compartilhar" class="btn btn-primary" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
        <span>Compartilhar ficha</span>
    </button>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">Compartilhar!</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div>
                O sistema de compartilhar fichas gera uma cópia de sua ficha a quem você escolheu compartilhar, essa
                pessoa não pode modificar a ficha.
            </div>
            <div class="dropdown mt-3">
                <label for="">Usuário</label><input type="text"> <br>
                <button type="button" id="compar">
                    Compartilhar
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../jquery-4.0.0.min.js"></script>
    <script src="../jquery.drawsvg.min.js"></script>
    <script>
        // Inicializa a animação drawsvg para cada ícone com seu respectivo tempo de duração
        var cafeSVG = $('#in').drawsvg({ duration: 1200 });
        var imaginSVG = $('#in2').drawsvg({ duration: 2500 });
        var caosSVG = $('#in3').drawsvg({ duration: 2500 });
        var amorSVG = $('#in4').drawsvg({ duration: 1200 });

        // Dispara o efeito de animação de desenho nos SVGs
        cafeSVG.drawsvg('animate');
        imaginSVG.drawsvg('animate');
        caosSVG.drawsvg('animate');
        amorSVG.drawsvg('animate');

        function rolar() {
            let numDeDados = $('#num').val();
            let valores = [];
            for (let i = 0; i < numDeDados; i++) {
                valores[i] = Math.floor(Math.random() * (6 - 1 + 1)) + 1;
            }
            $('#perg').css('display', 'none');
            let modeloRes = ' ';
            for (let i = 0; i < valores.length; i++) {
                modeloRes += `<div class="dado">${valores[i]}</div>`;
            }
            $('#result').append(modeloRes);
            $('#result').css('display', 'flex');
        }
        $('#staticBackdrop').on('hidden.bs.modal', function () {
            $('#perg').css('display', 'block');
            $('#result').css('display', 'none').empty();
            $('#num').val('');
        });
    </script>
</body>

</html>
